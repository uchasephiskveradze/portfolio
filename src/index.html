  <!-- Visitors opening /ka get the Georgian font before first paint (no font swap jump). -->
  <script>
    var seg = location.pathname.split('/')[1], lang = seg;
    if (!seg) { try { lang = localStorage.getItem('user_language'); } catch (e) {} }
    if (lang === 'ka') {
      document.documentElement.lang = 'ka';
      document.querySelector('link[rel="canonical"]').href = 'https://uchaportfolio.netlify.app/ka';
      [400, 500, 600, 700].forEach(function (w) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'font'; l.type = 'font/otf'; l.crossOrigin = 'anonymous';
        l.href = '/assets/fonts/mersad-' + w + '.otf';
        document.head.appendChild(l);
      });
    }
  </script>
