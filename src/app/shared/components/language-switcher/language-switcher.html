<!-- Fixed-size pill: same width in both languages so nothing around it moves. -->
<div class="no-ka flex items-center gap-1 bg-gray-800/80 backdrop-blur-sm border border-gray-700 rounded-full p-1 shadow-lg"
    role="group" [attr.aria-label]="'LANGUAGE.SWITCH' | translate">
    @for (lang of languages; track lang.code) {
    <button type="button" (click)="setLanguage(lang.code)" (pointerenter)="prefetch(lang.code)"
        (focus)="prefetch(lang.code)" (touchstart)="prefetch(lang.code)" [attr.aria-pressed]="currentLang() === lang.code"
        [attr.lang]="lang.code" [attr.title]="lang.label" [attr.aria-label]="lang.label"
        class="no-ka inline-flex items-center justify-center w-11 h-10 rounded-full text-xs font-bold transition-colors duration-200 cursor-pointer focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-400"
        [class.bg-emerald-500]="currentLang() === lang.code" [class.text-gray-950]="currentLang() === lang.code"
        [class.text-gray-400]="currentLang() !== lang.code" [class.hover:text-emerald-400]="currentLang() !== lang.code">
        {{ lang.short }}
    </button>
    }
</div>
