<section id="education" class="py-16 md:py-20 px-4 sm:px-6 relative" aria-labelledby="education-title">
    <div class="max-w-6xl mx-auto">

        <div class="text-center mb-10 md:mb-14">
            <h2 id="education-title" class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4">
                {{ 'EDUCATION.TITLE' | translate }}
            </h2>
            <p class="text-gray-400 text-base sm:text-lg">
                {{ 'EDUCATION.SUBTITLE' | translate }}
            </p>
        </div>

        <div class="relative">
            <div class="hidden md:block absolute left-1/2 top-0 bottom-0 w-0.5 bg-linear-to-b from-emerald-500 via-blue-500 to-purple-500 -translate-x-1/2"
                aria-hidden="true">
            </div>

            <ol class="space-y-6 md:space-y-10">
                @for (item of education(); track item.id; let isEven = $even) {
                <li class="relative flex items-center md:gap-16" [ngClass]="isEven ? 'md:flex-row' : 'md:flex-row-reverse'">

                    <div class="flex-1 min-w-0">
                        <div
                            class="relative bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-2xl p-5 sm:p-6 hover:border-emerald-400/50 transition-colors duration-300"
                            [ngClass]="isEven ? 'md:text-right' : 'md:text-left'">
                            <div class="flex items-start gap-4" [ngClass]="isEven ? 'md:flex-row-reverse' : ''">
                                <!-- Inline icon on mobile; the timeline dot replaces it on desktop -->
                                <div class="md:hidden w-10 h-10 shrink-0 rounded-full bg-linear-to-br {{ item.color }} flex items-center justify-center"
                                    aria-hidden="true">
                                    <lucide-icon [img]="item.icon" class="w-5 h-5 text-white"></lucide-icon>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <p class="text-sm text-gray-400">{{ item.dates }}</p>
                                    <h3 class="text-lg sm:text-xl font-bold text-white mt-1">
                                        {{ item.program }}
                                    </h3>
                                    <p class="text-emerald-400 font-semibold mt-1">
                                        {{ item.institution }}
                                    </p>
                                    <p class="text-gray-400 text-sm leading-relaxed mt-2">
                                        {{ item.description }}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 items-center justify-center z-10"
                        aria-hidden="true">
                        <div
                            class="w-14 h-14 rounded-full bg-linear-to-br {{ item.color }} flex items-center justify-center shadow-lg border-4 border-gray-900">
                            <lucide-icon [img]="item.icon" class="w-6 h-6 text-white"></lucide-icon>
                        </div>
                    </div>

                    <div class="hidden md:block flex-1" aria-hidden="true"></div>
                </li>
                }
            </ol>
        </div>
    </div>
</section>
