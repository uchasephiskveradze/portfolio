<section
    class="min-h-[100svh] md:min-h-[70vh] flex items-center justify-center px-4 sm:px-6 pt-20 pb-12 md:py-16 relative overflow-hidden">
    <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div class="absolute top-20 left-10 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-10 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    </div>

    <div
        class="max-w-6xl w-full mx-auto flex flex-col-reverse md:grid md:grid-cols-[minmax(0,1fr)_auto] gap-10 lg:gap-16 items-center relative z-10">
        <div class="min-w-0 space-y-6 text-center md:text-left">
            <div class="space-y-2">
                <p class="ka-sans text-emerald-400 font-mono text-sm tracking-wider">
                    {{ 'HERO.GREETING' | translate }}
                </p>
                <!-- Size is capped so the longer Georgian name still fits next to the photo. -->
                <h1 class="text-[clamp(1.75rem,5.2vw,3.75rem)] font-bold text-white leading-tight text-balance">
                    {{ 'HERO.NAME' | translate }}
                </h1>
            </div>

            <p class="text-xl sm:text-2xl md:text-3xl font-bold text-gray-300">
                {{ 'HERO.ROLE' | translate }}
            </p>

            <p class="text-base sm:text-lg text-gray-400 leading-relaxed max-w-xl mx-auto md:mx-0">
                {{ 'HERO.DESCRIPTION' | translate }}
            </p>

            <div class="flex flex-wrap justify-center md:justify-start gap-3 sm:gap-4 pt-2">
                <button type="button" (click)="viewProjects.emit()"
                    class="inline-flex items-center justify-center rounded-md bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-semibold px-6 h-[3.25rem] sm:h-14 text-sm sm:text-base transition-colors cursor-pointer w-full sm:w-auto sm:min-w-52">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="mr-2 shrink-0" aria-hidden="true">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    {{ 'HERO.VIEW_PROJECTS' | translate }}
                </button>

                <a [href]="cv().href" [attr.download]="cv().name"
                    class="inline-flex items-center justify-center rounded-md border-2 border-emerald-400 text-emerald-400 hover:bg-emerald-400/10 font-semibold px-6 h-[3.25rem] sm:h-14 text-sm sm:text-base transition-colors cursor-pointer w-full sm:w-auto sm:min-w-56">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="mr-2 shrink-0" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" x2="12" y1="15" y2="3"></line>
                    </svg>
                    {{ 'HERO.DOWNLOAD_CV' | translate }}
                </a>

                <div class="flex gap-3 sm:gap-4 w-full sm:w-auto justify-center">
                    <a href="https://www.linkedin.com/in/ucha-sephiskveradze/" target="_blank" rel="noopener noreferrer"
                        class="inline-flex items-center justify-center rounded-md border-2 border-gray-700 text-gray-400 hover:text-blue-400 hover:border-blue-400 hover:bg-blue-400/10 w-14 h-[3.25rem] sm:h-14 transition-colors duration-300 cursor-pointer"
                        [attr.aria-label]="'HERO.LINKEDIN' | translate">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z">
                            </path>
                            <rect x="2" y="9" width="4" height="12"></rect>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                    </a>
                    <a href="https://github.com/uchasephiskveradze" target="_blank" rel="noopener noreferrer"
                        class="inline-flex items-center justify-center rounded-md border-2 border-gray-700 text-gray-400 hover:text-white hover:border-gray-400 hover:bg-gray-400/10 w-14 h-[3.25rem] sm:h-14 transition-colors duration-300 cursor-pointer"
                        [attr.aria-label]="'HERO.GITHUB' | translate">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path
                                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.230-.15 1.85v4">
                            </path>
                            <path d="M9 18c-4.51 2-5-2-5-4"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <div class="flex justify-center shrink-0">
            <div class="relative group">
                <div class="absolute -inset-1 bg-linear-to-r from-emerald-500 to-blue-500 rounded-full blur-lg opacity-50 group-hover:opacity-75 transition-opacity duration-500"
                    aria-hidden="true">
                </div>
                <div
                    class="relative w-[220px] h-[220px] sm:w-72 sm:h-72 xl:w-80 xl:h-80 rounded-full overflow-hidden border-4 border-gray-800">
                    <img ngSrc="assets/ucha.webp" alt="Ucha Sephiskveradze" width="384" height="384" priority
                        class="w-full h-full object-cover" />
                </div>
                <div class="absolute -top-2 -right-2 sm:-top-3 sm:-right-3 bg-emerald-500/20 backdrop-blur-sm border border-emerald-400/30 rounded-lg px-3 py-1 sm:px-4 sm:py-2 font-mono text-emerald-400 text-xs sm:text-sm"
                    aria-hidden="true">
                    &lt;/&gt;
                </div>
                <div class="absolute -bottom-2 -left-2 sm:-bottom-3 sm:-left-3 bg-blue-500/20 backdrop-blur-sm border border-blue-400/30 rounded-lg px-3 py-1 sm:px-4 sm:py-2 font-mono text-blue-400 text-xs sm:text-sm"
                    aria-hidden="true">
                    &#123; &#125;
                </div>
            </div>
        </div>
    </div>
</section>
