<section id="skills" class="py-16 md:py-20 px-4 sm:px-6 relative" aria-labelledby="skills-title">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-10 md:mb-14">
            <h2 id="skills-title" class="text-3xl sm:text-4xl md:text-5xl font-bold text-white mb-4">
                {{ 'SKILLS.TITLE' | translate }}
            </h2>
            <p class="text-gray-400 text-base sm:text-lg">
                {{ 'SKILLS.SUBTITLE' | translate }}
            </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
            @for (group of groups; track group.key) {
            <div
                class="bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-2xl p-5 sm:p-6 hover:border-emerald-400/50 transition-colors duration-300">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 shrink-0 rounded-lg bg-linear-to-br {{ group.color }} flex items-center justify-center text-white"
                        aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            @for (path of group.iconPaths; track path) {
                            <path [attr.d]="path" />
                            }
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-white">
                        {{ 'SKILLS.GROUPS.' + group.key | translate }}
                    </h3>
                </div>

                <ul class="flex flex-wrap gap-2">
                    @for (item of group.items; track item) {
                    <li
                        class="no-ka inline-flex items-center rounded-full bg-gray-900/60 border border-gray-700 px-3 py-1 text-sm text-gray-200">
                        {{ item }}
                    </li>
                    }
                </ul>
            </div>
            }
        </div>
    </div>
</section>
